<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="340 100 350 380" width="350" height="380" role="img" aria-label="Logo" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.t{transform-box:fill-box;transform-origin:center}
.glow{animation:pulse 4s ease-in-out infinite}
.hanger{fill:none;stroke:#12284a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .1s cubic-bezier(.6,0,.2,1) forwards}
.box{opacity:0;animation:pop .8s .9s cubic-bezier(.34,1.56,.64,1) forwards}
.float{animation:float 3.6s 2.2s ease-in-out infinite}
.rib{opacity:0;animation:fade .6s 1.5s forwards}
.edge{fill:none;stroke:#12284a;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.shine{transform:translateX(-200px);animation:shine 4.5s 2.6s ease-in-out infinite}
.guide{fill:none;stroke:#5de0a0;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3 7;opacity:0;animation:guide .6s 1.1s forwards,flow 1.6s 1.7s linear infinite}
.trail{fill:none;stroke:#5de0a0;stroke-width:5;stroke-linecap:round}
.pf{animation:pfloat 5s 4.4s ease-in-out infinite}
.sp{opacity:0;fill:#8ff0b0;animation:spark 2.4s ease-in-out infinite}
.shadow{opacity:0;animation:shadow 3.6s 2.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shine{0%,55%{transform:translateX(-200px)}100%{transform:translateX(260px)}}
@keyframes guide{to{opacity:.55}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pfloat{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-6px)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes shadow{0%,100%{opacity:.25;transform:scaleX(1)}50%{opacity:.12;transform:scaleX(.82)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style>
<defs>
<radialGradient id="gGlow"><stop offset="0" stop-color="#3cdc96" stop-opacity=".3"/><stop offset="1" stop-color="#3cdc96" stop-opacity="0"/></radialGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fd49a"/><stop offset="1" stop-color="#1f9d6b"/></linearGradient>
<linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22a874"/><stop offset="1" stop-color="#127a52"/></linearGradient>
<linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#178a5e"/><stop offset="1" stop-color="#0e6444"/></linearGradient>
<linearGradient id="gP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9af5c4"/><stop offset="1" stop-color="#2fd08e"/></linearGradient>
<clipPath id="cT"><path d="M512 250 L607 305 L512 355 L412 305Z"/></clipPath>
<clipPath id="cL"><path d="M412 305 L512 355 L512 455 L412 405Z"/></clipPath>
<clipPath id="cR"><path d="M512 355 L607 305 L607 405 L512 455Z"/></clipPath>
<clipPath id="cAll"><path d="M512 250 L607 305 L607 405 L512 455 L412 405 L412 305Z"/></clipPath>
</defs>
<ellipse class="t glow" cx="515" cy="335" rx="165" ry="170" fill="url(#gGlow)"/>
<ellipse class="t shadow" cx="512" cy="478" rx="62" ry="8" fill="#000"/>
<!-- hanger -->
<path class="hanger" pathLength="1" d="M512 214 C512 196 532 192 537 175 C542 154 525 140 508 142 C491 144 485 160 492 172"/>
<path class="hanger" pathLength="1" d="M512 214 L372 290 Q360 298 366 310 Q372 320 388 318 L412 318"/>
<path class="hanger" pathLength="1" d="M512 214 L650 286 Q662 294 658 306 Q652 318 636 318 L608 318"/>
<!-- box -->
<g class="float"><g class="t box">
<path d="M512 250 L607 305 L512 355 L412 305Z" fill="url(#gTop)"/>
<path d="M412 305 L512 355 L512 455 L412 405Z" fill="url(#gL)"/>
<path d="M512 355 L607 305 L607 405 L512 455Z" fill="url(#gR)"/>
<g class="rib" fill="none" stroke="#9af5c4" stroke-width="18">
<g clip-path="url(#cT)"><path d="M462 277 L560 330M560 277 L462 330"/></g>
<g clip-path="url(#cL)"><path d="M462 320 L462 440M400 352 L520 410"/></g>
<g clip-path="url(#cR)"><path d="M560 320 L560 440M502 410 L620 352"/></g>
</g>
<g clip-path="url(#cAll)"><g class="shine"><rect x="380" y="230" width="46" height="240" fill="#fff" opacity=".32"/></g></g>
<path class="edge" d="M512 250 L607 305 L607 405 L512 455 L412 405 L412 305Z"/>
<path class="edge" d="M412 305 L512 355 L607 305M512 355 L512 455"/>
</g></g>
<!-- plane -->
<path class="guide" d="M526 218 C566 246 620 236 624 204 C628 172 586 168 590 192 C594 216 626 190 650 140"/>
<path class="trail" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M526 218 C566 246 620 236 624 204 C628 172 586 168 590 192 C594 216 626 190 650 140">
<animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.6s" dur="2.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
<animate attributeName="opacity" from="1" to="0" begin="4.2s" dur="1.2s" fill="freeze"/>
</path>
<g class="pf"><g opacity="0">
<set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/>
<animateMotion dur="2.8s" begin="1.6s" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .25 1" path="M526 218 C566 246 620 236 624 204 C628 172 586 168 590 192 C594 216 626 190 650 140"/>
<g transform="scale(1.1)">
<path d="M32 0 L-26 -22 L-8 -1Z" fill="#9af5c4"/>
<path d="M32 0 L-8 -1 L-26 22Z" fill="url(#gP)"/>
<path d="M-8 -1 L-26 22 L-10 12Z" fill="#1f9d6b"/>
</g></g></g>
<!-- sparkles -->
<path class="sp t" style="animation-delay:2.6s" d="M690 140 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
<path class="sp t" style="animation-delay:3.4s" d="M560 112 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
<path class="sp t" style="animation-delay:4.1s" d="M640 215 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
